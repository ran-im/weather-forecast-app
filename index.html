<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast - Your Location</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .location-info {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .weather-main {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .current-weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .current-temp {
            font-size: 4rem;
            font-weight: bold;
            color: #0984e3;
        }

        .current-details {
            text-align: right;
        }

        .weather-icon {
            font-size: 5rem;
            text-align: center;
        }

        .weather-description {
            text-transform: capitalize;
            font-size: 1.2rem;
            color: #666;
            margin-top: 10px;
        }

        .weather-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .hourly-forecast {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 3px solid #74b9ff;
            padding-bottom: 10px;
        }

        .hourly-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 20px 0;
            scrollbar-width: thin;
        }

        .hourly-item {
            min-width: 100px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .hourly-item:hover {
            transform: translateY(-5px);
        }

        .hourly-time {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .hourly-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .hourly-temp {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0984e3;
        }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .forecast-day {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .forecast-day:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .forecast-date {
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .forecast-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .forecast-temp {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .temp-high {
            font-weight: bold;
            color: #e74c3c;
        }

        .temp-low {
            color: #3498db;
        }

        .forecast-desc {
            text-transform: capitalize;
            font-size: 0.9rem;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.5rem;
        }

        .error {
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header h1 {
                font-size: 2rem;
            }

            .current-temp {
                font-size: 3rem;
            }

            .forecast-container {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 15px;
            }

            .hourly-container {
                gap: 10px;
            }

            .hourly-item {
                min-width: 80px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Forecast</h1>
            <div class="location-info">
                <span id="cityName">Loading location...</span> | 
                <span id="currentDate"></span>
            </div>
        </header>

        <main id="weatherContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Loading weather data...</div>
            </div>
        </main>
    </div>

    <script>
        // Weather icon mapping
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        // API Key for OpenWeatherMap (you need to get your own free key from https://openweathermap.org/api)
        const API_KEY = 'YOUR_API_KEY_HERE'; // Replace with your actual API key
        
        function getCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('en-US', options);
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        async function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            });
                        },
                        (error) => {
                            // Default to New York if location access denied
                            console.error('Location access denied, using default location');
                            resolve({ lat: 40.7128, lon: -74.0060 });
                        }
                    );
                } else {
                    // Default to New York if geolocation not supported
                    resolve({ lat: 40.7128, lon: -74.0060 });
                }
            });
        }

        async function fetchWeatherData(lat, lon) {
            try {
                // Fallback demo data if API key is not set
                if (API_KEY === 'YOUR_API_KEY_HERE') {
                    return getDemoWeatherData();
                }

                const currentResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
                );
                
                const forecastResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`
                );

                if (!currentResponse.ok || !forecastResponse.ok) {
                    throw new Error('Weather data not available');
                }

                const current = await currentResponse.json();
                const forecast = await forecastResponse.json();

                return { current, forecast };
            } catch (error) {
                console.error('API Error:', error);
                return getDemoWeatherData();
            }
        }

        function getDemoWeatherData() {
            // Demo data for demonstration purposes
            return {
                current: {
                    name: 'Demo City',
                    main: {
                        temp: 22,
                        feels_like: 20,
                        temp_min: 18,
                        temp_max: 25,
                        humidity: 65,
                        pressure: 1013
                    },
                    weather: [{
                        main: 'Clear',
                        description: 'clear sky',
                        icon: '01d'
                    }],
                    wind: {
                        speed: 3.5,
                        deg: 230
                    },
                    visibility: 10000,
                    sys: {
                        sunrise: Date.now() / 1000 - 3600 * 6,
                        sunset: Date.now() / 1000 + 3600 * 6
                    }
                },
                forecast: {
                    list: generateHourlyForecast()
                }
            };
        }

        function generateHourlyForecast() {
            const hourly = [];
            const baseTemp = 20;
            const now = Date.now() / 1000;
            
            for (let i = 0; i < 40; i++) {
                hourly.push({
                    dt: now + i * 3600,
                    main: {
                        temp: baseTemp + Math.sin(i / 4) * 8 + Math.random() * 3
                    },
                    weather: [{
                        main: ['Clear', 'Clouds', 'Rain', 'Drizzle'][Math.floor(Math.random() * 4)],
                        description: ['clear sky', 'few clouds', 'light rain', 'scattered clouds'][Math.floor(Math.random() * 4)],
                        icon: ['01d', '02d', '10d', '03d'][Math.floor(Math.random() * 4)]
                    }]
                });
            }
            return hourly;
        }

        function formatTime(timestamp) {
            return new Date(timestamp * 1000).toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            if (date.toDateString() === today.toDateString()) {
                return 'Today';
            } else if (date.toDateString() === tomorrow.toDateString()) {
                return 'Tomorrow';
            } else {
                return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            }
        }

        function get7DayForecast(hourlyData) {
            const dailyData = {};
            
            hourlyData.forEach(item => {
                const date = new Date(item.dt * 1000);
                const dateKey = date.toDateString();
                
                if (!dailyData[dateKey]) {
                    dailyData[dateKey] = {
                        date: item.dt,
                        temps: [],
                        weather: item.weather[0],
                        humidity: []
                    };
                }
                
                dailyData[dateKey].temps.push(item.main.temp);
                dailyData[dateKey].humidity.push(item.main.humidity || 65);
            });

            return Object.values(dailyData).slice(0, 7).map(day => ({
                date: day.date,
                high: Math.max(...day.temps),
                low: Math.min(...day.temps),
                weather: day.weather,
                avgHumidity: Math.round(day.humidity.reduce((a, b) => a + b, 0) / day.humidity.length)
            }));
        }

        function renderWeather(data) {
            const { current, forecast } = data;
            
            document.getElementById('cityName').textContent = current.name;
            document.getElementById('currentDate').textContent = getCurrentDate();

            const todayHourly = forecast.list.filter(item => {
                const itemDate = new Date(item.dt * 1000);
                const today = new Date();
                return itemDate.toDateString() === today.toDateString();
            });

            const weeklyForecast = get7DayForecast(forecast.list);

            const weatherHTML = `
                <div class="weather-main">
                    <div class="current-weather">
                        <div>
                            <div class="current-temp">${Math.round(current.main.temp)}°C</div>
                            <div class="weather-description">${current.weather[0].description}</div>
                        </div>
                        <div class="weather-icon">${weatherIcons[current.weather[0].icon] || '🌤️'}</div>
                        <div class="current-details">
                            <div>Feels like: ${Math.round(current.main.feels_like)}°C</div>
                            <div>H: ${Math.round(current.main.temp_max)}° L: ${Math.round(current.main.temp_min)}°</div>
                        </div>
                    </div>

                    <div class="weather-stats">
                        <div class="stat-card">
                            <div class="stat-label">Wind Speed</div>
                            <div class="stat-value">${current.wind.speed.toFixed(1)} m/s</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Humidity</div>
                            <div class="stat-value">${current.main.humidity}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Pressure</div>
                            <div class="stat-value">${current.main.pressure} hPa</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Visibility</div>
                            <div class="stat-value">${(current.visibility / 1000).toFixed(1)} km</div>
                        </div>
                    </div>

                    <div class="hourly-forecast">
                        <h2 class="section-title">Today's Hourly Forecast</h2>
                        <div class="hourly-container">
                            ${todayHourly.map(hour => `
                                <div class="hourly-item">
                                    <div class="hourly-time">${formatTime(hour.dt)}</div>
                                    <div class="hourly-icon">${weatherIcons[hour.weather[0].icon] || '🌤️'}</div>
                                    <div class="hourly-temp">${Math.round(hour.main.temp)}°</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="weather-main">
                    <h2 class="section-title">7-Day Forecast</h2>
                    <div class="forecast-container">
                        ${weeklyForecast.map(day => `
                            <div class="forecast-day">
                                <div class="forecast-date">${formatDate(day.date)}</div>
                                <div class="forecast-icon">${weatherIcons[day.weather.icon] || '🌤️'}</div>
                                <div class="forecast-temp">
                                    <span class="temp-high">${Math.round(day.high)}°</span>
                                    <span class="temp-low">${Math.round(day.low)}°</span>
                                </div>
                                <div class="forecast-desc">${day.weather.description}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('weatherContent').innerHTML = weatherHTML;
        }

        function showError(message) {
            document.getElementById('weatherContent').innerHTML = `
                <div class="error">
                    <h3>Error Loading Weather</h3>
                    <p>${message}</p>
                    <p>Please check your internet connection and try again.</p>
                </div>
            `;
        }

        async function init() {
            try {
                const location = await getUserLocation();
                const weatherData = await fetchWeatherData(location.lat, location.lon);
                renderWeather(weatherData);
            } catch (error) {
                console.error('Error:', error);
                showError('Unable to load weather data. Please try again later.');
            }
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
